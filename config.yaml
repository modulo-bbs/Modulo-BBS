# Modulo BBS server configuration.
#
# CLI flags override these values: --host --port --ssh-port --nodes --plain --ssh
#
# server:
#   host:         bind address
#   telnet_port:  telnet listen port
#   ssh_port:     SSH listen port
#   max_nodes:    maximum concurrent nodes
#
# Core roles — which plugin directory fills each job. Omit a line to use
# the role name as the folder (login: login). Swap a folder with one line.
#
# The logon sequence lives in plugins/logon/data/sequence (owned by logon).
# The home tab strip lives in plugins/mainmenu/data/home (owned by mainmenu).

server:
  host: "127.0.0.1"
  telnet_port: 6400
  ssh_port: 6422
  max_nodes: 8

login: login
logon: logon
mainmenu: mainmenu
modal: modal

# HTTP control API (health, sessions, shutdown, broadcast).
# Disabled by default — set enabled: true to start the API server.
api:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  # keys:
  #   - name: "admin"
  #     key: "replace-with-a-real-secret"
